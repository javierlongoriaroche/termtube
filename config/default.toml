# TermTube configuration (~/.config/termtube/config.toml).
# Every key is optional; these are the defaults.

[general]
data_dir = "~/.termtube"   # cookies, logs and mpv socket
volume = 70

[account]
browser = "brave"          # browser read by `termtube login` (anything yt-dlp supports)
authuser = 0               # Google account index in that browser session (set by `termtube login`)

[mpv]
path = "mpv"
ytdlp_path = "yt-dlp"
extra_args = []            # e.g. ["--audio-device=coreaudio/..."]

[theme]
primary = "#61afef"
secondary = "#c678dd"
meter_colors = ["#98c379", "#e5c07b", "#e06c75"]

[meter]
enabled = true             # stereo level meter in the player bar (toggle with `v`)
