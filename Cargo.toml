[package]
name = "termtube"
version = "0.2.3"
edition = "2021"
description = "Lightweight YouTube Music client for the terminal: home, search, library, radio, likes and lyrics in ~50 MB of RAM"
license = "MIT"
repository = "https://github.com/javierlongoriaroche/termtube"
homepage = "https://javierlongoriaroche.github.io/termtube/"
readme = "README.md"
keywords = ["youtube-music", "music-player", "tui", "terminal", "mpv"]
categories = ["multimedia::audio", "command-line-utilities"]
include = ["/src", "/config/default.toml", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
shellexpand = "3"
thiserror = "2"
ytmapi-rs = { version = "0.3.3", features = ["reqwest", "rustls", "serde_json", "simplified-queries"], default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }

[dev-dependencies]
tempfile = "3"
